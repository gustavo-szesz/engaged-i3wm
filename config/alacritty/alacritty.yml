window:
  dimensions:
    columns: 120
    lines: 40
  padding:
    x: 12
    y: 12
  opacity: 0.95
  decorations: full
  title: Alacritty

scrollback_lines: 5000

font:
  normal:
    family: JetBrains Mono
    style: Regular
  bold:
    family: JetBrains Mono
    style: Bold
  italic:
    family: JetBrains Mono
    style: Italic
  bold_italic:
    family: JetBrains Mono
    style: Bold Italic
  size: 11.0

selection:
  save_to_clipboard: true

cursor:
  style: Beam
  vi_mode_style: Beam
  thickness: 0.15

bell:
  visual_bell:
    duration: 0

colors:
  # Solarized Dark Theme
  primary:
    background: '#002b36'
    foreground: '#839496'

  cursor:
    text: '#002b36'
    cursor: '#839496'

  normal:
    black: '#073642'
    red: '#dc322f'
    green: '#859900'
    yellow: '#b58900'
    blue: '#268bd2'
    magenta: '#d33682'
    cyan: '#2aa198'
    white: '#eee8d5'

  bright:
    black: '#002b36'
    red: '#cb4b16'
    green: '#586e75'
    yellow: '#657b83'
    blue: '#839496'
    magenta: '#6c71c4'
    cyan: '#93a1a1'
    white: '#fdf6e3'

  dim:
    black: '#073642'
    red: '#d30102'
    green: '#640f0f'
    yellow: '#7d6f00'
    blue: '#0a3549'
    magenta: '#c1002b'
    cyan: '#164f4f'
    white: '#d5ccba'

mouse:
  hide_when_typing: true

keyboard:
  bindings:
    - { key: V, mods: Control|Shift, action: Paste }
    - { key: C, mods: Control|Shift, action: Copy }
    - { key: N, mods: Control|Shift, action: CreateNewWindow }
    - { key: Plus, mods: Control, action: IncreaseFontSize }
    - { key: Minus, mods: Control, action: DecreaseFontSize }
    - { key: 0, mods: Control, action: ResetFontSize }
