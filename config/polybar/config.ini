;==========================================================
; Engaged Polybar Configuration
; Completo: Hora, Workspaces, RAM, CPU, Rede, Bateria, Volume, Temperature
;==========================================================

[colors]
background = #1a1a1a
foreground = #FFFFFF
primary = #663399
secondary = #D32F2F
accent = #FFC107
gray_dark = #2a2a2a
gray_light = #3a3a3a

[bar/main]
width = 100%
height = 28
radius = 6
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
line-color = ${colors.primary}
border-size = 0
border-color = #00000000
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1
font-0 = JetBrains Mono:size=10;2
font-1 = "Font Awesome 6 Free:size=10;2"
font-2 = "Font Awesome 6 Free Solid:size=10;2"
modules-left = i3
modules-center = date time
modules-right = network cpu memory temperature volume battery
tray-position = right
tray-padding = 2
tray-maxsize = 20
tray-background = ${colors.background}
cursor-click = pointer
cursor-scroll = ns-resize

;==========================================================
; MODULES - I3
;==========================================================

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode-padding = 2
label-mode-foreground = #000
label-mode-background = ${colors.primary}

label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = #FFFFFF
label-focused-padding = 2
label-focused-underline = ${colors.secondary}

label-unfocused = %name%
label-unfocused-background = ${colors.gray_dark}
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

label-visible = %name%
label-visible-background = ${colors.gray_light}
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = %name%!
label-urgent-background = ${colors.secondary}
label-urgent-foreground = #FFFFFF
label-urgent-padding = 2

;==========================================================
; MODULES - DATE & TIME
;==========================================================

[module/date]
type = internal/date
interval = 1
date = "%d/%m/%Y"
format = <label>
format-prefix = "📅 "
format-prefix-foreground = ${colors.accent}
label = %date%
label-foreground = ${colors.foreground}

[module/time]
type = internal/date
interval = 1
time = "%H:%M:%S"
format = <label>
format-prefix = "🕒 "
format-prefix-foreground = ${colors.primary}
label = %time%
label-foreground = ${colors.foreground}

;==========================================================
; MODULES - SYSTEM MONITORING
;==========================================================

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-prefix = "🖥️  "
format-prefix-foreground = ${colors.accent}
label = "%percentage:2%%"
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 1
format = <label>
format-prefix = "🧠 "
format-prefix-foreground = ${colors.accent}
label = "%percentage_used:2%%"
label-foreground = ${colors.foreground}

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70
format = <label>
format-prefix = "🌡️  "
format-prefix-foreground = ${colors.accent}
label = "%temperature-c:2%°C"
label-warn = "%temperature-c:2%°C"
label-warn-foreground = ${colors.secondary}
label-foreground = ${colors.foreground}

;==========================================================
; MODULES - NETWORK
;==========================================================

[module/network]
type = internal/network
interface = wlan0
interval = 1
format-connected = <label-connected>
format-connected-prefix = "📡 "
format-connected-prefix-foreground = ${colors.accent}
label-connected = "%downspeed:9% ↓ %upspeed:9% ↑"
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "⚠️  "
format-disconnected-prefix-foreground = ${colors.secondary}
label-disconnected = "No Network"
label-disconnected-foreground = ${colors.secondary}

;==========================================================
; MODULES - AUDIO / VOLUME
;==========================================================

[module/volume]
type = internal/alsa
master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default
mapped = true
format-volume = <label-volume>
format-volume-prefix = "🔊 "
format-volume-prefix-foreground = ${colors.accent}
label-volume = "%percentage:3%%"
label-volume-foreground = ${colors.foreground}

format-muted = <label-muted>
format-muted-prefix = "🔇 "
format-muted-prefix-foreground = ${colors.secondary}
label-muted = "Muted"
label-muted-foreground = ${colors.secondary}

click-right = pavucontrol
scroll-up = amixer set Master 5%+
scroll-down = amixer set Master 5%-

;==========================================================
; MODULES - BATTERY
;==========================================================

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
poll-interval = 5
time-format = %H:%M

format-charging = <label-charging>
format-charging-prefix = "🔌 "
format-charging-prefix-foreground = ${colors.primary}
label-charging = "%percentage:3%%"
label-charging-foreground = ${colors.foreground}

format-discharging = <label-discharging>
format-discharging-prefix = "🔋 "
format-discharging-prefix-foreground = ${colors.accent}
label-discharging = "%percentage:3%%"
label-discharging-foreground = ${colors.foreground}

format-full = <label-full>
format-full-prefix = "✅ "
format-full-prefix-foreground = ${colors.primary}
label-full = "100%"
label-full-foreground = ${colors.foreground}

format-low = <label-low>
format-low-prefix = "⚠️  "
format-low-prefix-foreground = ${colors.secondary}
label-low = "%percentage:3%%"
label-low-foreground = ${colors.secondary}

ramp-capacity-0 = 🪫
ramp-capacity-1 = 🔋
ramp-capacity-2 = 🔋
ramp-capacity-3 = 🔋
ramp-capacity-4 = 🔌

;==========================================================
; SETTINGS
;==========================================================

[settings]
screenchange-reload = true
pseudo-composition = true

[global/wm]
margin-top = 0
margin-bottom = 0
